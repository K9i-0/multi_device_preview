name: multi_device_preview
description: >-
  Run a Flutter app on multiple device sizes and text scales side by side in a
  single macOS window, and mirror input from one device to the others.
version: 0.0.1-dev.1
repository: https://github.com/K9i-0/multi_device_preview
issue_tracker: https://github.com/K9i-0/multi_device_preview/issues
topics:
  - device-preview
  - testing
  - layout
  - responsive

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  device_preview: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
