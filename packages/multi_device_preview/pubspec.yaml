name: multi_device_preview
description: >-
  Run a Flutter app on multiple device sizes and text scales side by side in a
  single macOS window, and mirror input from one device to the others.
version: 1.0.0
repository: https://github.com/K9i-0/multi_device_preview
issue_tracker: https://github.com/K9i-0/multi_device_preview/issues
topics:
  - device-preview
  - testing
  - layout
  - responsive

screenshots:
  - description: The example app on four devices side by side.
    path: doc/screenshot.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  args: ^2.5.0
  device_preview: ^3.0.0
  flutter:
    sdk: flutter
  path: ^1.8.0
  yaml: ^3.1.0
  yaml_edit: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
