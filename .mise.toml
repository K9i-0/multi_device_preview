[tools]
flutter = "3.47.8"

[tasks.setup]
description = "Resolve workspace dependencies"
run = "flutter pub get"

[tasks.format]
description = "Format Dart sources"
run = "git ls-files --cached --others --exclude-standard -z -- '*.dart' | xargs -0 dart format"

[tasks.format-check]
description = "Check Dart formatting without modifying files"
run = "git ls-files --cached --others --exclude-standard -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed"

[tasks.analyze]
description = "Run static analysis on every workspace package"
run = "dart analyze --fatal-infos packages"

[tasks.test]
description = "Run the tests of every package and the example"
run = [
  "cd packages/multi_device_preview && flutter test",
  "cd packages/multi_device_preview_marionette && flutter test",
  "cd packages/multi_device_preview/example && flutter test",
]

[tasks.publish-check]
description = "Validate the packages for pub.dev"
run = [
  "cd packages/multi_device_preview && flutter pub publish --dry-run",
  "cd packages/multi_device_preview_marionette && flutter pub publish --dry-run",
]

[tasks.smoke]
description = "Drive the example on macOS and save screenshots to tmp/smoke"
dir = "packages/multi_device_preview/example"
run = "flutter run -d macos -t smoke/main.dart --dart-define=OUT={{config_root}}/tmp/smoke"

[tasks.example]
description = "Run the example on macOS"
dir = "packages/multi_device_preview/example"
run = "flutter run -d macos"

[tasks.check]
description = "Run all local quality checks"
depends = ["format-check", "analyze", "test"]

[tasks.e2e]
description = "Run the required Patrol regression suite on macOS"
dir = "packages/multi_device_preview/example"
run = "python3 ../../../tool/run_patrol.py --device macos"
