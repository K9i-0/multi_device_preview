name: Publish

# A main push only validates. Publication requires an explicit release tag.
on:
  push:
    tags:
      - 'multi_device_preview-v*'
      - 'multi_device_preview_marionette-v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.package.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate package, version, changelog, and main ancestry
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tool/validate_release.py

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # OIDC credentials are only requested after all required checks passed.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise run setup
      - name: Validate the selected package
        working-directory: ${{ needs.validate-tag.outputs.dir }}
        run: flutter pub publish --dry-run
      - name: Publish to pub.dev
        working-directory: ${{ needs.validate-tag.outputs.dir }}
        run: flutter pub publish --force
