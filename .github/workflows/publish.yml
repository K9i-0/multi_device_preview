name: Publish

# A main push only validates. Publication requires an explicit release tag.
on:
  push:
    tags:
      - 'multi_device_preview-v*'
      - 'multi_device_preview_marionette-v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.package.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate package, version, changelog, and main ancestry
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tool/validate_release.py

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # OIDC credentials are only requested after all required checks passed.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: mise run setup
      - name: Validate the selected package
        working-directory: ${{ needs.validate-tag.outputs.dir }}
        run: flutter pub publish --dry-run
      - name: Publish to pub.dev
        working-directory: ${{ needs.validate-tag.outputs.dir }}
        run: flutter pub publish --force
