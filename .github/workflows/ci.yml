name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run setup
      - run: mise run check
      - run: mise run publish-check

  patrol:
    name: Patrol macOS regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run setup
      - run: mise run e2e
      - name: Upload Patrol diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-results
          retention-days: 7
          path: |
            packages/multi_device_preview/example/build/ios_integ/Logs/Test/*.xcresult
            packages/multi_device_preview/example/build/*_results_*.xcresult
            packages/multi_device_preview/example/build/patrol_results*
            packages/multi_device_preview/example/build/patrol_logs*
          if-no-files-found: ignore
